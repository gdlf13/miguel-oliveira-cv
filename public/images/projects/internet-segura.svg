<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="40%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#c8a44e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="photoClip">
      <rect x="440" y="140" width="720" height="420" rx="28"/>
    </clipPath>
    <linearGradient id="photoFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="60%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </linearGradient>
    <mask id="photoMask">
      <rect x="440" y="140" width="720" height="420" fill="white"/>
      <rect x="440" y="140" width="720" height="420" fill="url(#photoFade)"/>
    </mask>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow1)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>
  <!-- Floating shapes -->
  <circle cx="300" cy="180" r="130" fill="#0ea5e9" opacity="0.1" filter="url(#blur1)"/>
  <circle cx="1300" cy="700" r="160" fill="#c8a44e" opacity="0.08" filter="url(#blur1)"/>
  <rect x="1050" y="80" width="180" height="180" rx="36" fill="white" opacity="0.03" transform="rotate(12 1140 170)"/>
  <rect x="150" y="580" width="140" height="140" rx="28" fill="white" opacity="0.03" transform="rotate(-15 220 650)"/>
  <!-- Glass card -->
  <rect x="420" y="120" width="760" height="480" rx="32" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>
  <!-- Photo embedded inside glass card with bottom fade -->
  <g clip-path="url(#photoClip)" opacity="0.85">
    <image xlink:href="/images/projects/internet-segura.jpg" x="440" y="140" width="720" height="405" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <!-- Fade overlay at bottom of photo to blend into background -->
  <rect x="440" y="360" width="720" height="200" fill="url(#bg)" opacity="0.7" rx="0"/>
  <!-- Small shield accent bottom-right of card -->
  <path d="M860 480 L900 496 L900 540 C900 564 860 580 860 580 C860 580 820 564 820 540 L820 496 Z" fill="none" stroke="#c8a44e" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
  <path d="M847 530 L858 541 L878 518" fill="none" stroke="#c8a44e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <!-- Decorative dots -->
  <circle cx="480" cy="540" r="3" fill="white" opacity="0.3"/>
  <circle cx="505" cy="540" r="3" fill="white" opacity="0.2"/>
  <circle cx="530" cy="540" r="3" fill="white" opacity="0.15"/>
  <!-- Title text -->
  <text x="800" y="680" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="32" font-weight="600" opacity="0.7" letter-spacing="2">O QUE A INTERNET DIZ DE SI</text>
  <!-- Subtitle -->
  <text x="800" y="720" text-anchor="middle" fill="#c8a44e" font-family="system-ui,sans-serif" font-size="18" font-weight="500" opacity="0.6" letter-spacing="3">OPP · CNCS · INTERNET SEGURA</text>
  <!-- Label -->
  <text x="800" y="830" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="24" font-weight="500" opacity="0.4" letter-spacing="6">CIBERSEGURANÇA</text>
</svg>
